<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="880" height="600" fill="#ffffff"/>
  <!-- window -->
  <rect x="20" y="20" width="840" height="560" rx="8" fill="#f7f7f8" stroke="#9a9aa2" stroke-width="1.5"/>
  <text x="44" y="56" font-size="18" font-weight="bold" fill="#222">Employee Onboarding Form</text>
  <text x="44" y="78" font-size="12" fill="#666">Candidate: Test Candidate  ·  Status: Draft</text>
  <!-- tabs -->
  <g font-size="13">
    <rect x="44" y="96" width="130" height="34" rx="4" fill="#e6e6ea" stroke="#b5b5bd"/>
    <text x="109" y="118" text-anchor="middle" fill="#444">Personal</text>
    <rect x="180" y="96" width="130" height="34" rx="4" fill="#e6e6ea" stroke="#b5b5bd"/>
    <text x="245" y="118" text-anchor="middle" fill="#444">Professional</text>
    <rect x="316" y="96" width="130" height="34" rx="4" fill="#ffffff" stroke="#3b5bdb" stroke-width="2"/>
    <text x="381" y="118" text-anchor="middle" fill="#3b5bdb" font-weight="bold">Education *</text>
    <rect x="452" y="96" width="130" height="34" rx="4" fill="#e6e6ea" stroke="#b5b5bd"/>
    <text x="517" y="118" text-anchor="middle" fill="#444">Documents</text>
    <text x="600" y="118" fill="#3b5bdb" font-size="11">← NEW separate tab</text>
  </g>
  <!-- panel -->
  <rect x="44" y="130" width="792" height="380" fill="#ffffff" stroke="#b5b5bd"/>
  <!-- error banner -->
  <rect x="64" y="146" width="752" height="34" rx="4" fill="#fdecec" stroke="#e03131"/>
  <text x="78" y="168" font-size="12" fill="#c92a2a">Education details are required before you can submit. 2 fields are missing.</text>
  <!-- qualification block -->
  <text x="64" y="208" font-size="14" font-weight="bold" fill="#222">Qualification 1</text>
  <g font-size="12" fill="#333">
    <text x="64" y="236">Highest qualification *</text>
    <rect x="64" y="244" width="350" height="32" rx="3" fill="#fff" stroke="#9a9aa2"/>
    <text x="74" y="265" fill="#555">B.E. Computer Science</text>
    <text x="440" y="236">Institution *</text>
    <rect x="440" y="244" width="356" height="32" rx="3" fill="#fff" stroke="#e03131" stroke-width="1.5"/>
    <text x="450" y="265" fill="#aaa">Required</text>
    <text x="64" y="304">Year of passing *</text>
    <rect x="64" y="312" width="170" height="32" rx="3" fill="#fff" stroke="#e03131" stroke-width="1.5"/>
    <text x="74" y="333" fill="#aaa">YYYY</text>
    <text x="252" y="304">Grade / percentage</text>
    <rect x="252" y="312" width="162" height="32" rx="3" fill="#fff" stroke="#9a9aa2"/>
    <text x="262" y="333" fill="#aaa">Optional</text>
    <text x="440" y="304">Certificate</text>
    <rect x="440" y="312" width="356" height="32" rx="3" fill="#f1f3f5" stroke="#9a9aa2" stroke-dasharray="4 3"/>
    <text x="618" y="333" text-anchor="middle" fill="#666">Upload file</text>
  </g>
  <!-- add another -->
  <rect x="64" y="364" width="210" height="30" rx="4" fill="#fff" stroke="#3b5bdb"/>
  <text x="169" y="384" text-anchor="middle" font-size="12" fill="#3b5bdb">+ Add another qualification</text>
  <!-- help tip -->
  <rect x="64" y="414" width="732" height="76" rx="4" fill="#f1f3f5" stroke="#ced4da"/>
  <text x="78" y="436" font-size="12" font-weight="bold" fill="#333">Why we ask</text>
  <text x="78" y="456" font-size="12" fill="#555">HR needs your education details to complete your joining process.</text>
  <text x="78" y="474" font-size="12" fill="#555">Add your highest qualification first; add others if you have them.</text>
  <!-- footer -->
  <rect x="44" y="510" width="792" height="54" fill="#f7f7f8" stroke="#b5b5bd"/>
  <rect x="560" y="522" width="120" height="32" rx="4" fill="#fff" stroke="#9a9aa2"/>
  <text x="620" y="543" text-anchor="middle" font-size="12" fill="#444">Save draft</text>
  <rect x="696" y="522" width="120" height="32" rx="4" fill="#adb5bd"/>
  <text x="756" y="543" text-anchor="middle" font-size="12" fill="#fff">Submit</text>
  <text x="64" y="543" font-size="11" fill="#888">Submit is disabled until all * fields are filled</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
